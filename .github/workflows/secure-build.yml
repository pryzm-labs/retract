name: Secure build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-checks:
    name: Container checks (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in the locked container
        run: >-
          docker buildx build
          --platform linux/${{ matrix.arch }}
          --target checks
          --output type=cacheonly
          --progress plain
          .

  native-macos-package:
    name: Native macOS package
    needs: container-checks
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the pinned Node toolchain
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the native application
        run: npm run tauri build -- --bundles app

      - name: Verify the ad-hoc development signature
        run: codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Retract.app
