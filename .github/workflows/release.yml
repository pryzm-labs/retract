name: Unsigned preview release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate source tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the pinned Node toolchain
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Match the tag to every application manifest
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Unsigned previews must be dispatched from an existing tag." >&2
            exit 1
          fi
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          npm run check:public-repo

  container-checks:
    name: Container checks (${{ matrix.arch }})
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in the locked container
        run: >-
          docker buildx build
          --platform linux/${{ matrix.arch }}
          --target checks
          --output type=cacheonly
          --progress plain
          .

  package-macos:
    name: Package Apple-silicon macOS preview
    needs: container-checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an Apple-silicon host
        run: test "$(uname -m)" = "arm64"

      - name: Use the pinned Node toolchain
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and verify the unsigned preview
        run: npm run package:unsigned

      - name: Upload only the reviewed release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retract-unsigned-preview
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release/Retract-*.app.zip
            artifacts/release/Retract-*.app.zip.sha256
            artifacts/release/Retract-*.app.zip.manifest.json

  release-preview:
    name: Attest and publish unsigned preview
    needs: package-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the reviewed release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retract-unsigned-preview
          path: artifacts/release

      - name: Verify the downloaded release set
        shell: bash
        run: |
          mapfile -t release_files < <(find artifacts/release -maxdepth 1 -type f -print | sort)
          if [[ "${#release_files[@]}" -ne 3 ]]; then
            printf 'Expected exactly three release files, found:\n%s\n' "${release_files[*]}" >&2
            exit 1
          fi
          cd artifacts/release
          sha256sum --check Retract-*.app.zip.sha256

      - name: Generate build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/release/Retract-*.app.zip
            artifacts/release/Retract-*.app.zip.sha256
            artifacts/release/Retract-*.app.zip.manifest.json

      - name: Create the unsigned GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="${RUNNER_TEMP}/retract-release-notes.md"
          printf '%s\n' \
            '> [!WARNING]' \
            '> This is destructive pre-release software for Apple-silicon Macs running macOS 12 or newer.' \
            '>' \
            '> The app has a hardened ad-hoc signature but is not Apple-notarized. Verify the checksum and provenance, or build from source.' \
            '' \
            'See the [unsigned install instructions](https://github.com/Pryzm-Labs/retract#install-an-unsigned-preview) before opening the app.' \
            > "${notes_file}"
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/release/Retract-*.app.zip \
            artifacts/release/Retract-*.app.zip.sha256 \
            artifacts/release/Retract-*.app.zip.manifest.json \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes-file "${notes_file}" \
            --title "Retract ${GITHUB_REF_NAME} (unsigned preview)"
