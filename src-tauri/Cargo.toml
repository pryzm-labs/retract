[package]
name = "retract"
version = "0.1.0"
description = "Local-first Telegram history search, cleanup, and redaction for macOS"
authors = ["Pryzm Labs"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Pryzm-Labs/retract"
homepage = "https://github.com/Pryzm-Labs/retract"

[lib]
name = "retract_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.11"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
cleaner-domain = { path = "../crates/cleaner-domain" }
retract-domain = { path = "../crates/retract-domain" }
futures-util = "0.3"
libloading = "0.9.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.1"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["LAContext", "block2"] }
security-framework = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
