[package]
name = "cleaner-domain"
version = "0.1.0"
description = "Capability and deletion-plan invariants for Retract"
authors = ["Pryzm Labs"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Pryzm-Labs/retract"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
