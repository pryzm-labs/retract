[package]
name = "discord-archive"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
